[project]
name = "video-txt"
version = "0.2.0"
description = "Transcribe, translate, subtitle and dub local audio or video files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-whisper>=20250625",
]

[project.optional-dependencies]
dub = [
    "edge-tts>=7.0.0",
]
mlx = [
    "mlx-whisper>=0.4.0",
]

[project.scripts]
video-txt = "video_txt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
